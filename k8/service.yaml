apiVersion: v1
kind: Service
metadata:
  name: k8demo-service
  namespace: demo
spec:
  type: NodePort  # Using NodePort for local development with Kind
  selector:
    app: k8demo  # This should match the labels in your deployment
  ports:
    - protocol: TCP
      port: 8080  # The port your service listens on
      targetPort: 8080  # The port your application listens on (containerPort in deployment)
      nodePort: 30080  # Optional: specify a node port (30000-32767)
